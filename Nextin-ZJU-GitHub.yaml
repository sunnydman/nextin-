x-nextin:
  version: 1
  mode: subscription-template
mode: rule
log-level: info
ipv6: false
proxies: []
dns:
  enable: true
  ipv6: false
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
proxy-groups:
- name: PROXY
  type: select
  include-all-proxies: true
  proxies:
  - DIRECT
- name: AI 固定出口
  type: select
  proxies:
  - PROXY
- name: 日常代理
  type: select
  proxies:
  - PROXY
- name: 开发服务
  type: select
  proxies:
  - AI 固定出口
  - 日常代理
- name: 通讯社交
  type: select
  proxies:
  - 日常代理
  - AI 固定出口
- name: 国际影音
  type: select
  proxies:
  - 日常代理
  - AI 固定出口
- name: 苹果服务
  type: select
  proxies:
  - DIRECT
  - 日常代理
  - AI 固定出口
- name: 微软服务
  type: select
  proxies:
  - DIRECT
  - 日常代理
  - AI 固定出口
- name: 校园文献
  type: select
  proxies:
  - DIRECT
  - 日常代理
  - AI 固定出口
- name: 广告过滤
  type: select
  proxies:
  - REJECT
  - 日常代理
  - DIRECT
- name: 网络测速
  type: select
  proxies:
  - DIRECT
  - 日常代理
  - AI 固定出口
